<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Huddinge Karta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;background:#111;overscroll-behavior:none;font-family:'Inter',sans-serif}

/* ══ SHELL ══ */
#app{position:fixed;inset:0;background:#f6f6f6}
#mapWrap{position:absolute;inset:0}
#map{position:absolute;inset:0;z-index:0}
.leaflet-control-zoom,.leaflet-control-attribution{display:none!important}

/* ══ TOP BAR ══ */
#topBar{
  position:absolute;top:0;left:0;right:0;z-index:100;
  padding:calc(env(safe-area-inset-top,44px) + 12px) 16px 20px;
  background:linear-gradient(to bottom,rgba(0,0,0,.12) 0%,rgba(0,0,0,0) 100%);
  pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
#topBar>*{pointer-events:auto}
#topChips{
  display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  /* Vertical padding so chip shadows aren't clipped */
  padding:6px 0;margin:-6px 0;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,black 20px,black calc(100% - 48px),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0%,black 20px,black calc(100% - 48px),transparent 100%);
}
#topChips::-webkit-scrollbar{display:none}
/* Spacer after last chip so it scrolls fully into view when at end */
#topChips::after{content:'';flex-shrink:0;width:48px;display:block;min-width:48px}

.chip{
  display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 8px;
  border-radius:40px;border:none;flex-shrink:0;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:500;white-space:nowrap;
  backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  cursor:pointer;transition:background .15s,opacity .15s;
}
.chip svg{width:16px;height:16px;flex-shrink:0}
.chip.chip-dim{opacity:.38}

.filter-pill{
  display:flex;align-items:center;gap:6px;height:40px;padding:4px 12px 4px 10px;
  border-radius:40px;border:none;flex-shrink:0;
  background:rgba(255,255,255,.9);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  box-shadow:0 8px 25px rgba(0,0,0,.10);cursor:pointer;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#000;
}
.filter-pill.active{background:#000;color:#fff}
.filter-pill svg{width:18px;height:18px}

/* ══ BACK BUTTON (when card panel visible) ══ */
#backBtn{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;z-index:201;
  display:none;align-items:center;gap:6px;padding:6px 12px 6px 8px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  border-radius:40px;border:none;cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.10);
  font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#000;
}
#backBtn svg{width:18px;height:18px}
#backBtn.visible{display:flex}

/* ══ MARKERS ══ */
.mpin{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.mpin:hover{transform:scale(1.08)}
.pin-label{
  position:absolute;left:calc(100% + 6px);top:6px;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:#1a1a1a;
  white-space:nowrap;pointer-events:none;display:none;
  text-shadow:
    -1px -1px 0 #fff, 1px -1px 0 #fff,
    -1px  1px 0 #fff, 1px  1px 0 #fff,
    0 -2px 0 #fff,    0  2px 0 #fff,
    -2px 0 0 #fff,    2px 0 0 #fff;
}
#map.labels-visible .pin-label{display:block}
.mpin-tail{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);background:white;border-radius:80px 80px 4px 80px;box-shadow:0 6px 12px rgba(0,0,0,.12),0 16px 32px rgba(0,0,0,.10)}
.mpin-circle{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mpin-circle svg{width:24px;height:24px}
.mpin-sm .mpin-tail{width:44.3px;height:44.3px}
.mpin-sm .mpin-circle{width:40px;height:40px;padding:8px}
.mpin-lg .mpin-tail{width:61.9px;height:61.9px}
.mpin-lg .mpin-circle{width:56px;height:56px;padding:12px}
.user-dot{width:26px;height:26px;border-radius:50%;background:white;box-shadow:0 4px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.user-dot-inner{width:18px;height:18px;border-radius:50%;background:#357af6}

/* ══ CARD PANEL ══ */
#cardPanel{
  position:absolute;left:0;right:0;bottom:0;z-index:200;
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(.32,.94,.6,1);
  /* gradient above cards */
  background:linear-gradient(to top,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 100%);
  padding-top:72px;
}
#cardPanel.visible{transform:translateY(0)}

#closeCardBtn{
  position:absolute;top:16px;right:16px;
  display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  border-radius:40px;border:none;cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.10);
  font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#000;
}
#closeCardBtn svg{width:18px;height:18px}

#cardScroll{
  display:flex;gap:12px;overflow-x:auto;
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 16px) 0;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  align-items:stretch;
}
#cardScroll::-webkit-scrollbar{display:none}
/* Spacers för korrekt padding i scroll-containers */
#cardScroll::before,#cardScroll::after{content:'';display:block;flex-shrink:0;min-width:16px;width:16px}
#cardScroll.single-card{overflow-x:hidden;padding-left:16px;padding-right:16px}
#cardScroll.single-card::before,#cardScroll.single-card::after{display:none}
#cardScroll.single-card .ev-card{width:100%}

/* ══ EVENT CARD ══ */
.ev-card{
  flex-shrink:0;width:calc(100vw - 96px); /* tease: ~60-70px av nästa kort syns */
  background:#fff;
  border-radius:24px;
  box-shadow:0 4px 8px -1px rgba(0,0,0,.06),0 16px 32px -4px rgba(0,0,0,.12);
  padding:8px;
  scroll-snap-align:start;cursor:pointer;
  display:flex;flex-direction:column;
  height:340px; /* fast höjd = alla kort lika höga */
}
.ev-card-img{width:100%;height:128px;border-radius:16px;object-fit:cover;display:block;background:#e0e0e0;flex-shrink:0}
.ev-card-body{padding:12px 8px 8px;flex:1;display:flex;flex-direction:column;min-height:0}
.ev-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.ev-card-name{font-size:15px;font-weight:500;color:#000;line-height:1.2}
.ev-card-desc{font-size:13px;color:rgba(0,0,0,.7);margin-top:2px}
.ev-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ev-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:13px;font-weight:500;background:rgba(0,0,0,.07);color:#000;white-space:nowrap}
.ev-tag svg{width:14px;height:14px;opacity:.55;flex-shrink:0}
.ev-card-btns{display:flex;gap:6px;margin-top:auto;flex-shrink:0}
.btn-ghost{flex:1;padding:16px 8px;border-radius:56px;background:rgba(70,70,70,.1);border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#000;cursor:pointer;white-space:nowrap}
.btn-dark{flex:1;padding:16px 8px;border-radius:56px;background:#000;border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#fff;cursor:pointer;white-space:nowrap}
.free-badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:8px;font-size:13px;font-weight:600;background:rgba(52,199,89,.15);color:#1a7a38}

/* ══ FLOATING TAB BAR ══ */
#tabBar{
  position:absolute;
  bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  left:50%;transform:translateX(-50%);
  z-index:350;
  display:flex;gap:8px;align-items:center;
  transition:transform .35s cubic-bezier(.32,.94,.6,1),opacity .35s;
}
#tabBar.hidden{
  transform:translateX(-50%) translateY(calc(100% + 40px));
  opacity:0;pointer-events:none;
}
#tabPill{
  display:flex;gap:4px;padding:4px;
  background:#fff;border-radius:96px;
  box-shadow:0 6px 6px rgba(0,0,0,.07),0 22px 18px rgba(0,0,0,.07);
}
.tab-btn{
  display:flex;align-items:center;gap:8px;
  height:48px;padding:8px 16px;border-radius:120px;border:none;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;transition:background .18s,color .18s;white-space:nowrap;
}
.tab-btn svg{width:24px;height:24px;flex-shrink:0;display:none}
.tab-btn.active svg{display:block}
.tab-btn.active{background:rgba(6,138,153,.16);color:#068a99}
.tab-btn:not(.active){background:#fff;color:#000}
#searchTabBtn{
  display:flex;align-items:center;justify-content:center;
  width:56px;height:56px;border-radius:72px;border:none;
  background:#fff;cursor:pointer;
  box-shadow:0 6px 6px rgba(0,0,0,.07),0 22px 18px rgba(0,0,0,.07);
}
#searchTabBtn svg{width:28px;height:28px}

/* ══ CALENDAR VIEW ══ */
#calendarView{
  position:absolute;inset:0;z-index:300;background:#f6f6f6;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.94,.6,1);
  overflow-y:auto;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
}
#calendarView::-webkit-scrollbar{display:none}
#calendarView.visible{transform:translateY(0)}
.cal-header{background:#f6f6f6}
.cal-header-top{
  display:flex;justify-content:flex-end;gap:8px;
  padding:calc(env(safe-area-inset-top,44px) + 8px) 16px 0;
}
.cal-header-main{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px 4px;
}
.cal-icon-wrap{
  width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  border-radius:134px;flex-shrink:0;
}
.cal-icon-wrap svg{width:32px;height:32px}
.cal-title{font-size:24px;font-weight:600;color:#000;line-height:1.2}
.cal-sub{font-size:14px;font-weight:500;color:rgba(0,0,0,.6);margin-top:4px}
.cal-chips{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:8px 16px 12px;
}
.cal-chips::-webkit-scrollbar{display:none}
.cal-section{padding:16px 0 0}
.cal-section-title{font-size:18px;font-weight:500;color:#000;margin-bottom:8px;padding:0 16px}
.cal-h-scroll{
  display:flex;gap:8px;overflow-x:auto;padding:4px 16px 16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.cal-h-scroll::-webkit-scrollbar{display:none}
.cal-card{
  flex-shrink:0;width:299px;background:#fff;
  border-radius:24px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 4px 8px -1px rgba(0,0,0,.03),0 8px 16px -2px rgba(0,0,0,.03);
  cursor:pointer;transition:transform .15s;
}
.cal-card:active{transform:scale(.97)}
.cal-card-img{width:100%;height:128px;object-fit:cover;display:block;background:#e8e8e8;flex-shrink:0}
.cal-card-body{padding:12px;flex:1;display:flex;flex-direction:column}
.cal-card-name{font-size:15px;font-weight:500;color:#000;line-height:1.2;margin-bottom:2px}
.cal-card-desc{font-size:13px;color:rgba(0,0,0,.7);margin-bottom:14px;flex:1}
.cal-card-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.cal-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 6px;border-radius:8px;font-size:13px;font-weight:500;
  background:rgba(0,0,0,.07);color:#000;white-space:nowrap;
}
.cal-tag svg{width:18px;height:18px;flex-shrink:0}

/* ══ SEARCH SCREEN ══ */
#searchScreen{
  position:absolute;inset:0;z-index:400;background:#fff;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.94,.6,1);
}
#searchScreen.visible{transform:translateY(0)}
.srch-top{padding:calc(env(safe-area-inset-top,44px) + 12px) 16px 16px;background:#f8f8f8;border-bottom:.5px solid rgba(0,0,0,.08)}
.srch-row{display:flex;gap:10px;align-items:center}
.srch-input-pill{flex:1;height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#fff;border-radius:40px;border:.5px solid rgba(0,0,0,.14)}
.srch-input-pill input{flex:1;border:none;outline:none;background:transparent;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#000}
.srch-input-pill input::placeholder{color:rgba(0,0,0,.4)}
.srch-input-pill svg{opacity:.3;flex-shrink:0}
.srch-cancel{background:none;border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#000;cursor:pointer;white-space:nowrap;padding:0 4px;opacity:.7}
.srch-results{padding:16px;overflow-y:auto;height:calc(100% - 110px);scrollbar-width:none}
.srch-results::-webkit-scrollbar{display:none}
.srch-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.09);margin-bottom:10px;display:flex;transition:transform .12s;cursor:pointer}
.srch-card:active{transform:scale(.98)}
.srch-card-img{width:80px;height:80px;object-fit:cover;flex-shrink:0;background:#e8e8e8}
.srch-card-body{padding:10px 12px;flex:1;min-width:0}
.srch-card-title{font-size:15px;font-weight:600;color:#000;margin-bottom:2px}
.srch-card-desc{font-size:13px;color:rgba(0,0,0,.6);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-card-cat{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:600}
.srch-empty{padding:60px 16px;text-align:center;color:rgba(0,0,0,.4);font-size:15px}

/* ══ DETAIL SCREEN ══ */
#detailScreen{
  position:absolute;inset:0;z-index:500;background:#f6f6f6;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.94,.6,1);
  overflow-y:auto;
}
#detailScreen::-webkit-scrollbar{display:none}
#detailScreen.visible{transform:translateX(0)}
.det-hero{width:100%;height:300px;object-fit:cover;display:block;background:#ddd}
.det-back{
  position:fixed;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;z-index:10;
  display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;
  background:rgba(255,255,255,.2);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  border-radius:40px;border:none;cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.10);
  font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#fff;
}
.det-back svg{width:18px;height:18px}
.det-card{background:#f6f6f6;border-radius:32px 32px 0 0;margin-top:-40px;position:relative;z-index:1;padding:24px 16px 140px}
.det-cat-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:40px;font-size:13px;font-weight:600;margin:0 auto 10px;display:flex;width:fit-content}
.det-title{font-size:24px;font-weight:600;color:#000;text-align:center;line-height:1.2;margin-bottom:8px}
.det-subtitle{font-size:13px;color:rgba(0,0,0,.7);text-align:center;margin-bottom:20px}
.det-stats{display:flex;border:.5px solid rgba(0,0,0,.1);border-radius:12px;overflow:hidden;margin-bottom:20px}
.det-stat{flex:1;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;border-right:.5px solid rgba(0,0,0,.1)}
.det-stat:last-child{border-right:none}
.det-stat-icon{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center}
.det-stat-icon svg{width:36px;height:36px}
.det-stat-val{font-size:12px;font-weight:600;color:#000;text-align:center;line-height:1.3}
.det-desc{font-size:14px;color:rgba(0,0,0,.8);line-height:1.7;margin-bottom:24px}
.det-map-label{font-size:13px;color:rgba(0,0,0,.7);font-weight:500;margin-bottom:8px}
.det-map{width:100%;height:180px;border-radius:16px;overflow:hidden;margin-bottom:12px;background:#e8e8e8}
.det-addr-name{font-size:20px;font-weight:600;color:#000;margin-bottom:4px}
.det-addr-street{font-size:13px;color:rgba(0,0,0,.7);margin-bottom:24px}
.det-divider{height:.5px;background:rgba(0,0,0,.1);margin-bottom:16px}
.det-host{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.det-host-logo{width:56px;height:56px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;text-align:center;padding:6px;line-height:1.2}
.det-host-name{font-size:18px;font-weight:600;color:#000}
.det-host-since{font-size:13px;color:rgba(0,0,0,.7);margin-top:4px}
.det-bottom{
  position:fixed;bottom:0;left:0;right:0;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(to top,rgba(255,255,255,.97) 60%,transparent);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;
}
.det-bottom.visible{display:block}
.det-bottom-row{display:flex;gap:6px}

/* ══ FILTER PANEL ══ */
#filterBg{position:absolute;inset:0;z-index:600;background:rgba(0,0,0,0);transition:background .25s;pointer-events:none}
#filterPanel{
  position:absolute;top:0;right:0;bottom:0;z-index:601;
  width:min(360px,92vw);background:#f8f8f8;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.32,.94,.6,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.12);
}
#filterPanel.open{transform:translateX(0)}
.fp-head{padding:calc(env(safe-area-inset-top,44px) + 12px) 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid rgba(0,0,0,.09);flex-shrink:0}
.fp-title{font-size:18px;font-weight:700;color:#000}
.fp-close{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fp-body{flex:1;overflow-y:auto;padding:20px;scrollbar-width:none}
.fp-body::-webkit-scrollbar{display:none}
.fp-section{margin-bottom:24px}
.fp-section-title{font-size:13px;font-weight:600;color:rgba(0,0,0,.5);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.fp-toggle-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.fp-toggle-label{display:flex;flex-direction:column;gap:2px}
.fp-toggle-label span:first-child{font-size:16px;font-weight:600;color:#000}
.fp-toggle-label span:last-child{font-size:13px;color:rgba(0,0,0,.5)}
.toggle-sw{position:relative;width:51px;height:31px;flex-shrink:0}
.toggle-sw input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;border-radius:31px;background:rgba(0,0,0,.15);cursor:pointer;transition:background .2s}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
input:checked+.toggle-track{background:#34c759}
input:checked+.toggle-track::after{transform:translateX(20px)}
.fp-chips{display:flex;flex-wrap:wrap;gap:8px}
.fp-chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:40px;border:.5px solid rgba(0,0,0,.14);background:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:#000;cursor:pointer;transition:background .15s,border-color .15s;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-chip.on{background:#000;color:#fff;border-color:#000}
.fp-footer{padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:.5px solid rgba(0,0,0,.09);display:flex;gap:8px;flex-shrink:0;background:#f8f8f8}
.fp-reset{flex:1;padding:14px;border-radius:56px;background:rgba(0,0,0,.08);border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:#000;cursor:pointer}
.fp-apply{flex:2;padding:14px;border-radius:56px;background:#000;border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:#fff;cursor:pointer}

/* ══ DATE PICKER ══ */
#dateBg{position:absolute;inset:0;z-index:620;background:rgba(0,0,0,0);transition:background .25s;pointer-events:none}
#dateSheet{
  position:absolute;left:0;right:0;bottom:0;z-index:621;
  background:#fff;border-radius:24px 24px 0 0;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.94,.6,1);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
}
#dateSheet.open{transform:translateY(0)}
.dp-head{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px}
.dp-title{font-size:17px;font-weight:600;color:#000}
.dp-close{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dp-nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px 16px}
.dp-month-label{font-size:16px;font-weight:600;color:#000}
.dp-arrow{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.06);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dp-arrow svg{width:18px;height:18px}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;margin-bottom:4px}
.dp-weekday{text-align:center;font-size:12px;font-weight:500;color:rgba(0,0,0,.4);padding:6px 0}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 8px;gap:2px}
.dp-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:none;background:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:#000;
  position:relative;transition:background .12s;
}
.dp-day:disabled{color:rgba(0,0,0,.2);cursor:default}
.dp-day.selected{background:#068a99;color:#fff}
.dp-day-count{
  position:absolute;top:-3px;right:-3px;
  min-width:17px;height:17px;padding:0 4px;
  border-radius:99px;
  background:rgba(6,138,153,.15);
  color:#068a99;
  font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.dp-day.selected .dp-day-count{background:rgba(255,255,255,.25);color:#fff}
.dp-day.today{font-weight:700}
.dp-day.empty{pointer-events:none}
.dp-clear{display:block;width:calc(100% - 40px);margin:4px 20px 0;padding:14px;border-radius:56px;background:rgba(0,0,0,.07);border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:#000;cursor:pointer}

/* ══ ACTION SHEET ══ */
#actionSheetBg{position:absolute;inset:0;z-index:700;background:rgba(0,0,0,0);transition:background .25s;pointer-events:none}
#actionSheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:701;transform:translateY(calc(100% + 12px));transition:transform .32s cubic-bezier(.32,.94,.6,1)}
#actionSheetOptions{background:rgba(242,242,247,.92);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:16px;overflow:hidden;margin-bottom:8px}
#actionSheet .as-cancel{width:100%;padding:18px;background:rgba(242,242,247,.92);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:16px;border:none;font-family:'Inter',sans-serif;font-size:17px;font-weight:600;color:#007aff;cursor:pointer}
</style>
</head>
<body>
<div id="app">
<div id="mapWrap">
  <div id="map"></div>

  <!-- Top bar: chips + filter -->
  <div id="topBar">
    <div id="topChips"></div>
    <button class="filter-pill" id="filterBtn" onclick="toggleFilter()">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M6 10h8M9 15h2"/></svg>
      Filter
    </button>
  </div>

  <!-- Back button (shown when card panel open) -->
  <button id="backBtn" onclick="dismissCards()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Tillbaka
  </button>

  <!-- Card panel (shown when marker clicked) -->
  <div id="cardPanel">
    <button id="closeCardBtn" onclick="dismissCards()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Stäng
    </button>
    <div id="cardScroll"></div>
  </div>

  <!-- Calendar view -->
  <div id="calendarView">
    <div class="cal-header">
      <div class="cal-header-top">
        <button class="filter-pill" onclick="toggleFilter()">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M6 10h8M9 15h2"/></svg>
          Filter
        </button>
        <button class="filter-pill" id="calDatumBtn" onclick="openDatePicker()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/><path d="M12 13v2"/></svg>
          Datum
        </button>
      </div>
      <div class="cal-header-main">
        <div class="cal-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><rect x="8" y="14" width="2" height="2" rx=".5" fill="#000" stroke="none"/><rect x="11" y="14" width="2" height="2" rx=".5" fill="#000" stroke="none"/><rect x="14" y="14" width="2" height="2" rx=".5" fill="#000" stroke="none"/></svg>
        </div>
        <div>
          <div class="cal-title">Kalender</div>
          <div class="cal-sub">Se alla händelser som händer denna vecka</div>
        </div>
      </div>
    </div>
    <div class="cal-chips" id="calChips"></div>
    <div id="calContent"></div>
  </div>

  <!-- Search screen -->
  <div id="searchScreen">
    <div class="srch-top">
      <div class="srch-row">
        <div class="srch-input-pill">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="#000" stroke-width="1.8"/><path d="M17 17l-3.5-3.5" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Sök efter händelse eller plats..." autocomplete="off" oninput="onSearch(this.value)">
        </div>
        <button class="srch-cancel" onclick="closeSearch()">Avbryt</button>
      </div>
    </div>
    <div class="srch-results" id="searchResults"></div>
  </div>

  <!-- Detail screen -->
  <div id="detailScreen">
    <div id="detailCard" style="position:relative">
      <button class="det-back" id="detBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Tillbaka
      </button>
      <div id="detInner"></div>
    </div>
    <div class="det-bottom" id="detBottom">
      <div class="det-bottom-row">
        <button class="btn-ghost" id="detFlyBtn">Hitta hit</button>
        <button class="btn-dark" id="detJoinBtn">Ansök att gå med</button>
      </div>
    </div>
  </div>

  <!-- Filter panel -->
  <div id="filterBg" onclick="closeFilter()"></div>
  <div id="filterPanel">
    <div class="fp-head">
      <span class="fp-title">Filter</span>
      <button class="fp-close" onclick="closeFilter()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M1 1l12 12M13 1L1 13"/></svg>
      </button>
    </div>
    <div class="fp-body">
      <div class="fp-section">
        <div class="fp-section-title">Pris</div>
        <div class="fp-toggle-row">
          <div class="fp-toggle-label">
            <span>Gratis</span>
            <span>Visa endast gratis evenemang</span>
          </div>
          <label class="toggle-sw">
            <input type="checkbox" id="freeToggle" onchange="applyFilters()">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
      <div class="fp-section">
        <div class="fp-section-title">Organisatör</div>
        <div class="fp-chips" id="fpOrgs"></div>
      </div>
      <div class="fp-section">
        <div class="fp-section-title">Område</div>
        <div class="fp-chips" id="fpAreas"></div>
      </div>
    </div>
    <div class="fp-footer">
      <button class="fp-reset" onclick="resetFilters()">Rensa</button>
      <button class="fp-apply" onclick="closeFilter()">Visa resultat</button>
    </div>
  </div>

  <!-- Date picker sheet -->
  <div id="dateBg" onclick="closeDatePicker()"></div>
  <div id="dateSheet">
    <div class="dp-head">
      <span class="dp-title">Välj datum</span>
      <button class="dp-close" onclick="closeDatePicker()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M1 1l12 12M13 1L1 13"/></svg>
      </button>
    </div>
    <div class="dp-nav">
      <button class="dp-arrow" onclick="dpPrevMonth()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="dp-month-label" id="dpMonthLabel"></span>
      <button class="dp-arrow" onclick="dpNextMonth()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="dp-weekdays">
      <div class="dp-weekday">Mån</div><div class="dp-weekday">Tis</div>
      <div class="dp-weekday">Ons</div><div class="dp-weekday">Tor</div>
      <div class="dp-weekday">Fre</div><div class="dp-weekday">Lör</div>
      <div class="dp-weekday">Sön</div>
    </div>
    <div class="dp-days" id="dpDays"></div>
    <button class="dp-clear" id="dpClearBtn" onclick="clearDateFilter()" style="display:none">Rensa datumfilter</button>
  </div>

  <!-- Action sheet -->
  <div id="actionSheetBg" onclick="closeActionSheet()"></div>
  <div id="actionSheet">
    <div id="actionSheetOptions"></div>
    <button class="as-cancel" onclick="closeActionSheet()">Avbryt</button>
  </div>

  <!-- Floating tab bar -->
  <div id="tabBar">

    <button id="searchTabBtn" onclick="openSearch()">

  </div>

</div><!-- #mapWrap -->
</div><!-- #app -->

// Kategorier: events (tidsbaserade) + platser (permanenta)
const EVENT_CATS=['samhalle','kurs','konst','musik','fritid','spel','teater','hantverk','film'];
const PLATS_CATS=['fastkonst','motes'];

// Exakta färger från Figma (node 2036-2673)
const CAT_COLOR={
  musik:'#3d8700', konst:'#008296', teater:'#c0136f',
  fritid:'#be5a00', spel:'#6e19bb', hantverk:'#8f3c00',
  film:'#260096', kurs:'#4781ce',
  samhalle:'#666cd8',
  fastkonst:'#008296', motes:'#be5a00',
};
const CAT_BG={
  musik:'rgba(139,183,102,.2)', konst:'rgba(102,180,192,.2)', teater:'rgba(223,140,189,.2)',
  fritid:'rgba(216,156,102,.2)', spel:'rgba(142,21,255,.2)', hantverk:'rgba(187,79,7,.2)',
  film:'rgba(38,0,150,.2)', kurs:'rgba(71,129,206,.2)',
  samhalle:'rgba(102,108,216,.2)',
  fastkonst:'rgba(102,180,192,.2)', motes:'rgba(216,156,102,.2)',
};
const CAT_LABEL={
  musik:'Musik', konst:'Konst', teater:'Teater',
  fritid:'Fritid', spel:'Spel', hantverk:'Hantverk',
  film:'Film', kurs:'Kurs',
  samhalle:'Samhälle',
  fastkonst:'Fast konst', motes:'Mötesplats',
};
const AREAS_LIST=[
  {id:'flemingsberg',name:'Flemingsberg'},{id:'huddinge',name:'Huddinge'},
  {id:'skogas',name:'Skogås'},{id:'sjodalen',name:'Sjödalen'},
  {id:'glomsta',name:'Glömsta'},{id:'vistaberg',name:'Vistaberg'},{id:'lida',name:'Lida'}
];

// ── STATE ──────────────────────────────────────────────────────────────
let ITEMS=[], ORGS_LIST=[];
let map, leafMarkers={}, clusters=[], activeIds=[], selectedCat=null, activeTab='event', detailMapInstance=null;
const filterState={free:false,orgs:new Set(),areas:new Set()};

// ── CLUSTER HELPERS ────────────────────────────────────────────────────
function clusterKey(lat,lng){ return `${lat.toFixed(4)}_${lng.toFixed(4)}`; }

function buildClusters(items){
  const result=[];
  items.forEach(item=>{
    const c=result.find(c=>Math.abs(c.lat-item.lat)<0.0002&&Math.abs(c.lng-item.lng)<0.0002);
    if(c) c.items.push(item);
    else result.push({lat:item.lat,lng:item.lng,items:[item],key:clusterKey(item.lat,item.lng)});
  });
  return result;
}

// ── MAP ────────────────────────────────────────────────────────────────
const BOUNDS=L.latLngBounds([59.08,17.73],[59.34,18.24]);

function initMap(){
  map=L.map('map',{
    center:[59.218,17.978],zoom:13,minZoom:11,maxZoom:19,
    maxBounds:BOUNDS,maxBoundsViscosity:1,
    zoomControl:false,attributionControl:false
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
  const ui=L.divIcon({html:`<div class="user-dot"><div class="user-dot-inner"></div></div>`,className:'',iconSize:[26,26],iconAnchor:[13,13]});
  L.marker([59.2183,17.9384],{icon:ui,interactive:false}).addTo(map);
  rebuildClusterMarkers();
  map.on('click',()=>{ if(activeIds.length) dismissCards(); });
  map.on('zoomend moveend', ()=>setTimeout(checkLabelCollisions, 80));
  window.addEventListener('resize',()=>map.invalidateSize());
  document.getElementById('map').classList.add('labels-visible');
}

function mHtml(cat,big,label){
  const sz=big?'mpin-lg':'mpin-sm', wt=big?87.6:62.7, p=big?'16px':'10px';
  const icon=PIN_SVG[cat]||PIN_SVG['motes'];
  const lbl=label?`<div class="pin-label">${label}</div>`:'';
  return `<div class="mpin ${sz}" style="width:${wt}px;height:${wt}px">
    <div class="mpin-tail"></div>
    <div class="mpin-circle" style="background:${CAT_COLOR[cat]||'#555'};padding:${p}">${icon}</div>
    ${lbl}
  </div>`;
}

function mClusterHtml(cluster,big){
  const sz=big?'mpin-lg':'mpin-sm', wt=big?87.6:62.7;
  const fs=big?'20px':'15px';
  // En färg om alla samma kategori, annars mörk neutral
  const cats=[...new Set(cluster.items.map(i=>i.cat))];
  const color=cats.length===1?CAT_COLOR[cats[0]]:'#1c1c1e';
  return `<div class="mpin ${sz}" style="width:${wt}px;height:${wt}px">
    <div class="mpin-tail"></div>
    <div class="mpin-circle" style="background:${color};display:flex;align-items:center;justify-content:center">
      <span style="color:#fff;font-family:'Inter',sans-serif;font-size:${fs};font-weight:700;line-height:1;letter-spacing:-.5px">${cluster.items.length}</span>
    </div>
  </div>`;
}

function addClusterMarker(cluster){
  const isActive=cluster.items.some(i=>activeIds.includes(i.id));
  const big=isActive;
  const single=cluster.items.length===1;
  const item=cluster.items[0];
  const label=single&&item.type==='plats'?item.name:null;
  const html=single?mHtml(item.cat,big,label):mClusterHtml(cluster,big);
  const sz=big?87.6:62.7;
  const icon=L.divIcon({html,className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz]});
  const m=L.marker([cluster.lat,cluster.lng],{icon}).addTo(map);
  m.on('click',e=>{ L.DomEvent.stopPropagation(e); showCards(cluster.items.map(i=>i.id)); });
  leafMarkers[cluster.key]=m;
}

function refreshClusterByItemId(id){
  const cluster=clusters.find(c=>c.items.some(i=>i.id===id)); if(!cluster)return;
  const m=leafMarkers[cluster.key]; if(!m)return;
  const isActive=cluster.items.some(i=>activeIds.includes(i.id));
  const big=isActive;
  const single=cluster.items.length===1;
  const item0=cluster.items[0];
  const label=single&&item0.type==='plats'?item0.name:null;
  const html=single?mHtml(item0.cat,big,label):mClusterHtml(cluster,big);
  const sz=big?87.6:62.7;
  m.setIcon(L.divIcon({html,className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz]}));
}

function rebuildClusterMarkers(){
  Object.values(leafMarkers).forEach(m=>{ try{map.removeLayer(m);}catch(e){} });
  leafMarkers={};
  clusters=buildClusters(getVisible());
  clusters.forEach(addClusterMarker);
  setTimeout(checkLabelCollisions, 80);
}

function checkLabelCollisions(){
  const labels = Array.from(document.querySelectorAll('.pin-label'));
  // Reset
  labels.forEach(l => l.style.visibility = '');
  // Get rects of visible labels only
  const items = labels.map(l => ({ el:l, r:l.getBoundingClientRect() }))
                      .filter(({r}) => r.width > 0);
  const PAD = 6;
  for(let i=0; i<items.length; i++){
    if(items[i].el.style.visibility === 'hidden') continue;
    const a = items[i].r;
    for(let j=i+1; j<items.length; j++){
      if(items[j].el.style.visibility === 'hidden') continue;
      const b = items[j].r;
      const overlap = !(a.right+PAD < b.left-PAD || b.right+PAD < a.left-PAD ||
                        a.bottom+PAD < b.top-PAD  || b.bottom+PAD < a.top-PAD);
      if(overlap) items[j].el.style.visibility = 'hidden';
    }
  }
}

function showCards(ids){
  const prevIds=[...activeIds];
  activeIds=ids;
  prevIds.forEach(id=>{ if(!activeIds.includes(id)) refreshClusterByItemId(id); });
  activeIds.forEach(refreshClusterByItemId);

  // Render cards
  const scroll=document.getElementById('cardScroll');
  scroll.innerHTML=activeIds.map(id=>{
    const item=ITEMS.find(x=>x.id===id); if(!item)return'';
    return evCardHtml(item);
  }).join('');

  // Single card → full width
  scroll.classList.toggle('single-card', activeIds.length===1);

  // Show panel, hide tab bar, show back btn
  document.getElementById('cardPanel').classList.add('visible');
  document.getElementById('tabBar').classList.add('hidden');
  document.getElementById('backBtn').classList.add('visible');
  document.getElementById('topBar').style.opacity='0';
  document.getElementById('topBar').style.pointerEvents='none';

  // Fly to first item
  const first=ITEMS.find(x=>x.id===ids[0]);
  if(first) map.flyTo([first.lat,first.lng],15,{duration:0.7,easeLinearity:0.5});
}

function dismissCards(){
  const prevIds=[...activeIds];
  activeIds=[];
  prevIds.forEach(refreshClusterByItemId);
  document.getElementById('cardPanel').classList.remove('visible');
  document.getElementById('cardScroll').classList.remove('single-card');
  document.getElementById('tabBar').classList.remove('hidden');
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('topBar').style.opacity='';
  document.getElementById('topBar').style.pointerEvents='';
}

// ── CARD HTML ──────────────────────────────────────────────────────────
function evCardHtml(item){
  const col=CAT_COLOR[item.cat], lbl=CAT_LABEL[item.cat];
  return `<div class="ev-card" onclick="">
    <img class="ev-card-img" src="${item.img}" alt="${item.name}" loading="lazy">
    <div class="ev-card-body">
      <div class="ev-card-top">
        <div>
          <div class="ev-card-name">${item.name}</div>
          <div class="ev-card-desc">${item.desc}</div>
        </div>
      </div>
      <div class="ev-card-tags">
        ${item.type!=='plats'?`<span class="ev-tag">${S.clock}${item.date} · ${item.time.split('–')[0].split('-')[0]}</span>`:''}
        <span class="ev-tag">${S.pin}${item.loc}</span>
        <span class="ev-tag" style="background:${CAT_BG[item.cat]};color:${col}">${lbl}</span>
        ${item.free?'<span class="free-badge">Gratis</span>':''}
      </div>
      <div class="ev-card-btns">
        <button class="btn-ghost" onclick="openDetail(${item.id})">Mer info</button>
        <button class="btn-dark" onclick="openEventUrl(${JSON.stringify(item).replace(/"/g,'&quot;')})">Ansök</button>
      </div>
    </div>
  </div>`;
}

// ── TAB NAVIGATION ─────────────────────────────────────────────────────
function setTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===tab);
  });
  if(tab==='kalender'){
    document.getElementById('calendarView').classList.add('visible');
    renderCalendar();
  } else {
    document.getElementById('calendarView').classList.remove('visible');
    selectedCat=null;
    renderChips();
    applyFilters();
  }
}

// ── FILTER LOGIC ───────────────────────────────────────────────────────
function getVisible(){
  return ITEMS.filter(i=>{
    // Tab-based type filter
    if(activeTab==='event' && i.type!=='event') return false;
    if(activeTab==='platser' && i.type!=='plats') return false;
    if(activeTab==='kalender' && i.type!=='event') return false;
    if(selectedCat && i.cat!==selectedCat) return false;
    if(filterState.free && !i.free) return false;
    if(filterState.orgs.size>0 && !filterState.orgs.has(i.host)) return false;
    if(filterState.areas.size>0 && !filterState.areas.has(i.area)) return false;
    return true;
  });
}

function applyFilters(){
  filterState.free=document.getElementById('freeToggle').checked;
  rebuildClusterMarkers();
  updateFilterBtnState();
}

function updateFilterBtnState(){
  const active=filterState.free||filterState.orgs.size>0||filterState.areas.size>0;
  document.getElementById('filterBtn')?.classList.toggle('active',active);
}

function resetFilters(){
  filterState.free=false; filterState.orgs.clear(); filterState.areas.clear();
  document.getElementById('freeToggle').checked=false;
  document.querySelectorAll('#fpOrgs .fp-chip, #fpAreas .fp-chip').forEach(c=>c.classList.remove('on'));
  applyFilters();
}

function toggleFpChip(el,set,val){
  if(set.has(val)){set.delete(val);el.classList.remove('on');}
  else{set.add(val);el.classList.add('on');}
  applyFilters();
}

function initFilterChips(){
  const orgsEl=document.getElementById('fpOrgs');

// ── CATEGORY CHIPS ─────────────────────────────────────────────────────
function selectCat(cat){
  selectedCat=(selectedCat===cat)?null:cat;
  renderChips(); applyFilters();
}

function chipHtml(cat){
  const isOn=selectedCat===cat, isDim=selectedCat!==null&&!isOn;
  const col=CAT_COLOR[cat];
  const bg=isOn?col:CAT_BG[cat];
  const textCol=isOn?'#fff':col;
  return `<button class="chip${isDim?' chip-dim':''}" style="background:${bg};color:${textCol}" onclick="selectCat('${cat}')">
    ${CHIP_SVGS[cat]||''}${CAT_LABEL[cat]}
  </button>`;
}

function renderChips(){
  const cats = activeTab==='platser' ? PLATS_CATS : EVENT_CATS;
  const html = cats.map(c=>chipHtml(c)).join('');
  const tc=document.getElementById('topChips'); if(tc) tc.innerHTML=html;
  const cc=document.getElementById('calChips'); if(cc) cc.innerHTML=html;
}

// ── DATE PICKER ───────────────────────────────────────────────────────
const SMONTHS={jan:1,feb:2,mar:3,apr:4,maj:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dec:12};
const SMONTH_NAMES=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
const EVENT_YEAR=2026;
let selectedDate=null; // Date | null
let dpYear=2026, dpMonth=4; // 0-indexed, start at May

function parseEventDate(str){
  const s=str.toLowerCase().trim();
  // Cross-month: "30 maj–10 jun"
  let m=s.match(/^(\d+)\s+([a-zåäö]+)–(\d+)\s+([a-zåäö]+)$/);
  if(m){
    const mo1=SMONTHS[m[2].substring(0,3)]-1, mo2=SMONTHS[m[4].substring(0,3)]-1;
    return{start:new Date(EVENT_YEAR,mo1,+m[1]),end:new Date(EVENT_YEAR,mo2,+m[3])};
  }
  // Same-month range: "29–30 maj"
  m=s.match(/^(\d+)–(\d+)\s+([a-zåäö]+)$/);
  if(m){
    const mo=SMONTHS[m[3].substring(0,3)]-1;
    return{start:new Date(EVENT_YEAR,mo,+m[1]),end:new Date(EVENT_YEAR,mo,+m[2])};
  }
  // Single: "30 maj"
  m=s.match(/^(\d+)\s+([a-zåäö]+)$/);
  if(m){
    const mo=SMONTHS[m[2].substring(0,3)]-1;
    const d=new Date(EVENT_YEAR,mo,+m[1]);
    return{start:d,end:d};
  }
  return null;
}

function eventMatchesDate(item,date){
  const p=parseEventDate(item.date); if(!p) return true;
  return date>=p.start && date<=p.end;
}

function openDatePicker(){
  const bg=document.getElementById('dateBg');
  bg.style.pointerEvents='auto'; bg.style.background='rgba(0,0,0,.4)';
  document.getElementById('dateSheet').classList.add('open');
  renderDpCalendar();
}
function closeDatePicker(){
  document.getElementById('dateSheet').classList.remove('open');
  const bg=document.getElementById('dateBg');
  bg.style.background='rgba(0,0,0,0)'; bg.style.pointerEvents='none';
}
function dpPrevMonth(){
  dpMonth--; if(dpMonth<0){dpMonth=11;dpYear--;}
  renderDpCalendar();
}
function dpNextMonth(){
  dpMonth++; if(dpMonth>11){dpMonth=0;dpYear++;}
  renderDpCalendar();
}
function clearDateFilter(){
  selectedDate=null;
  document.getElementById('dpClearBtn').style.display='none';
  document.getElementById('calDatumBtn').classList.remove('active');
  renderDpCalendar(); renderCalendar();
}
function selectDay(year,month,day){
  selectedDate=new Date(year,month,day);
  document.getElementById('dpClearBtn').style.display='block';
  document.getElementById('calDatumBtn').classList.add('active');
  renderDpCalendar(); renderCalendar();
  setTimeout(closeDatePicker,180);
}

function renderDpCalendar(){
  document.getElementById('dpMonthLabel').textContent=SMONTH_NAMES[dpMonth]+' '+dpYear;
  const firstDay=new Date(dpYear,dpMonth,1).getDay(); // 0=Sun
  // Convert Sunday=0 to Monday=0
  const offset=(firstDay+6)%7;
  const daysInMonth=new Date(dpYear,dpMonth+1,0).getDate();
  // Count events per day
  const eventCount={};
  ITEMS.forEach(item=>{
    const p=parseEventDate(item.date); if(!p) return;
    for(let d=new Date(p.start);d<=p.end;d.setDate(d.getDate()+1)){
      if(d.getFullYear()===dpYear && d.getMonth()===dpMonth){
        const day=d.getDate();
        eventCount[day]=(eventCount[day]||0)+1;
      }
    }
  });
  const today=new Date(); const isThisMonth=today.getFullYear()===dpYear&&today.getMonth()===dpMonth;
  let html='';
  for(let i=0;i<offset;i++) html+=`<div class="dp-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isSelected=selectedDate&&selectedDate.getFullYear()===dpYear&&selectedDate.getMonth()===dpMonth&&selectedDate.getDate()===d;
    const cnt=eventCount[d]||0;
    const isToday=isThisMonth&&today.getDate()===d;
    const badge=cnt>0?`<span class="dp-day-count">${cnt}</span>`:'';
    html+=`<button class="dp-day${isSelected?' selected':''}${isToday?' today':''}" onclick="selectDay(${dpYear},${dpMonth},${d})">${d}${badge}</button>`;
  }
  document.getElementById('dpDays').innerHTML=html;
  document.getElementById('dpClearBtn').style.display=selectedDate?'block':'none';
}

// ── CALENDAR VIEW ──────────────────────────────────────────────────────
function calCardHtml(item){
  return `<div class="cal-card" onclick="calCardClick(${item.id})">
    <img class="cal-card-img" src="${item.img}" alt="${item.name}" loading="lazy">
    <div class="cal-card-body">
      <div class="cal-card-name">${item.name}</div>
      <div class="cal-card-desc">${item.desc}</div>
      <div class="cal-card-tags">
        <span class="cal-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          ${item.date}
        </span>
        <span class="cal-tag" style="background:${CAT_BG[item.cat]};color:${CAT_COLOR[item.cat]}">${CAT_LABEL[item.cat]}</span>
        ${item.free?'<span class="cal-tag" style="background:rgba(52,199,89,.12);color:#1a7a38">Gratis</span>':''}
      </div>
    </div>
  </div>`;
}

function renderCalendar(){
  let vis=getVisible();
  if(selectedDate) vis=vis.filter(i=>eventMatchesDate(i,selectedDate));
  const groups={
    'Maj'  : vis.filter(i=>i.date.toLowerCase().includes('maj')),
    'Juni' : vis.filter(i=>i.date.toLowerCase().includes('jun')),
    'Juli' : vis.filter(i=>i.date.toLowerCase().includes('jul')),
    'Höst' : vis.filter(i=>!['maj','jun','jul'].some(m=>i.date.toLowerCase().includes(m)))
  };
  const el=document.getElementById('calContent');
  const rendered=Object.entries(groups).filter(([,items])=>items.length).map(([title,items])=>`
    <div class="cal-section">
      <div class="cal-section-title">${title}</div>
      <div class="cal-h-scroll">${items.map(calCardHtml).join('')}</div>
    </div>`).join('');
  el.innerHTML=rendered||`<div style="padding:40px 16px;text-align:center;color:rgba(0,0,0,.4);font-size:15px">Inga events på valt datum</div>`;
}

function calCardClick(id){
  setTab('event');
  setTimeout(()=>{
    const item=ITEMS.find(x=>x.id===id);
    if(item){ showCards([id]); }
  },400);
}

// ── SEARCH ─────────────────────────────────────────────────────────────
function openSearch(){
  document.getElementById('searchScreen').classList.add('visible');
  setTimeout(()=>document.getElementById('searchInput').focus(),300);
  onSearch('');
}
function closeSearch(){
  document.getElementById('searchScreen').classList.remove('visible');
  document.getElementById('searchInput').value='';
}
function onSearch(q){
  const res=document.getElementById('searchResults');
  const term=q.trim().toLowerCase();
  const hits=term?ITEMS.filter(i=>
    i.name.toLowerCase().includes(term)||
    i.loc.toLowerCase().includes(term)||
    i.host.toLowerCase().includes(term)
  ):ITEMS;
  if(!hits.length){res.innerHTML=`<div class="srch-empty">Inga resultat för "${q}"</div>`;return;}
  res.innerHTML=hits.map(item=>`
    <div class="srch-card" onclick="closeSearch();showCards([${item.id}])">
      <img class="srch-card-img" src="${item.img}" alt="${item.name}" loading="lazy">
      <div class="srch-card-body">
        <div class="srch-card-title">${item.name}</div>
        <div class="srch-card-desc">${item.desc}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="srch-card-cat" style="background:${CAT_BG[item.cat]};color:${CAT_COLOR[item.cat]}">${CAT_LABEL[item.cat]}</span>
          ${item.free?'<span class="free-badge">Gratis</span>':''}
        </div>
      </div>
    </div>`).join('');
}

// ── ACTION SHEET ───────────────────────────────────────────────────────
function showActionSheet(opts){
  const bg=document.getElementById('actionSheetBg');
  const el=document.getElementById('actionSheet');
  document.getElementById('actionSheetOptions').innerHTML=opts.map((o,i)=>`
    <button onclick="actionSheetTap(${i})" style="width:100%;padding:17px 16px;background:none;border:none;border-top:${i>0?'0.5px solid rgba(0,0,0,.15)':'none'};font-family:'Inter',sans-serif;font-size:17px;font-weight:${o.bold?'600':'400'};color:${o.bold?'#000':'#007aff'};text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px">
      ${o.label}${o.subtitle?`<span style="font-size:13px;font-weight:400;color:rgba(0,0,0,.45)">${o.subtitle}</span>`:''}
    </button>`).join('');
  el._opts=opts;
  bg.style.pointerEvents='auto'; bg.style.background='rgba(0,0,0,.15)';
  el.style.transform='translateY(0)';
}
function closeActionSheet(){
  document.getElementById('actionSheetBg').style.cssText='background:rgba(0,0,0,0);pointer-events:none';
  document.getElementById('actionSheet').style.transform='translateY(calc(100% + 12px))';
}
function actionSheetTap(i){
  const o=document.getElementById('actionSheet')._opts[i];
  closeActionSheet(); if(o?.action) o.action();
}
function openMapsSheet(item){
  showActionSheet([
    {label:'🗺️ Öppna i Apple Kartor',action:()=>window.open(`https://maps.apple.com/?daddr=${item.lat},${item.lng}&dirflg=d`,'_blank')},
    {label:'📍 Öppna i Google Maps',action:()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`,'_blank')}
  ]);
}
function openEventUrl(itemJson){
  const item=typeof itemJson==='string'?JSON.parse(itemJson):itemJson;
  openEventUrlDirect(item);
}
function openEventUrlDirect(item){
  if(!item.url){
    showActionSheet([{label:`Kontakta ${item.host}`,subtitle:`Arrangör av ${item.name}`,bold:true,action:()=>{}}]);
    return;
  }
  const host=item.url.replace(/https?:\/\//,'').replace(/\/.*/,'');
  showActionSheet([{label:`Öppna ${host}`,subtitle:`Mer info om ${item.name}`,bold:true,action:()=>window.open(item.url,'_blank')}]);
}

// ── BOOT ──────────────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  fetch('events.json')
    .then(r=>r.json())
    .then(data=>{
      ITEMS=data;
      ORGS_LIST=[...new Set(data.map(i=>i.host))].sort();
      initMap();
      initFilterChips();
      renderChips();
      renderCalendar();
    })
    .catch(err=>console.error('Kunde inte ladda events.json:',err));
});
</script>
